spring.application.name=cyber-escape-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cyber_escape?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

app.seed-demo-data=${SEED_DEMO_DATA:false}
